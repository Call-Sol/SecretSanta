{{define "head"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{.Title}} · Secret Santa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{{end}}

{{define "nav"}}
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/groups">Secret Santa</a>
    {{if .Authed}}
    <div class="d-flex align-items-center gap-3 ms-auto">
      <a class="link-light text-decoration-none" href="/groups">Groups</a>
      <a class="link-light text-decoration-none" href="/users">Users</a>
      <form method="post" action="/logout" class="m-0">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
      </form>
    </div>
    {{end}}
  </div>
</nav>
{{end}}

{{define "foot"}}
</body>
</html>
{{end}}

{{define "alert"}}
{{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}
{{end}}
