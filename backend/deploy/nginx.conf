# Operator panel on the Ubuntu host.
# Install the HTTP site first, then let certbot add TLS:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp nginx.conf /etc/nginx/sites-available/secret-santa
#   sudo ln -s /etc/nginx/sites-available/secret-santa /etc/nginx/sites-enabled/secret-santa
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seven-santa.alma-dev.com
# Certbot rewrites the copy in sites-available. Do not copy this file over that copy again.

server {
    listen 80;
    listen [::]:80;
    server_name seven-santa.alma-dev.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
