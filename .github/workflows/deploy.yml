name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync the backend
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /opt/secret-santa/backend"
          rsync -az --delete \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./backend/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/secret-santa/backend/"

      - name: Recreate the stack
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -eu
            cd /opt/secret-santa/backend
            docker compose -p secret-santa --project-directory . -f deploy/docker-compose.yml up -d --build --wait --force-recreate
            curl -fsS -o /dev/null http://127.0.0.1:8080/login
            docker compose -p secret-santa --project-directory . -f deploy/docker-compose.yml ps'
